name: Test

on: ["pull_request", "push"]

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}
    - name: Set up Python
      uses: actions/setup-python@v5
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio
    - name: Run PlatformIO - Standard Example
      run: platformio ci --lib="." --board=uno --board=megaatmega2560 --board=esp32dev examples/MS5837_Example/*.ino
    
    - name: Run PlatformIO - ESP32 Example
      run: platformio ci --lib="." --board=esp32dev examples/MS5837_ESP32_Example/*.ino
